name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build binaries
        run: |
          VERSION=${GITHUB_REF_NAME}
          LDFLAGS="-s -w -X main.version=${VERSION}"
          GOOS=darwin  GOARCH=arm64  go build -ldflags "$LDFLAGS" -o dist/argus-darwin-arm64   ./cmd/argus/
          GOOS=darwin  GOARCH=amd64  go build -ldflags "$LDFLAGS" -o dist/argus-darwin-amd64   ./cmd/argus/
          GOOS=linux   GOARCH=amd64  go build -ldflags "$LDFLAGS" -o dist/argus-linux-amd64    ./cmd/argus/
          GOOS=linux   GOARCH=arm64  go build -ldflags "$LDFLAGS" -o dist/argus-linux-arm64    ./cmd/argus/
          GOOS=windows GOARCH=amd64  go build -ldflags "$LDFLAGS" -o dist/argus-windows-amd64.exe ./cmd/argus/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - name: Update Homebrew formula
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          VERSION=${GITHUB_REF_NAME}
          TARBALL_URL="https://github.com/argusgate/argus/archive/refs/tags/${VERSION}.tar.gz"
          SHA256=$(curl -fsSL "$TARBALL_URL" | sha256sum | awk '{print $1}')

          git clone "https://x-access-token:${GH_PAT}@github.com/argusgate/homebrew-tap.git" /tmp/homebrew-tap
          cd /tmp/homebrew-tap

          sed -i "s|url \".*\"|url \"${TARBALL_URL}\"|" Formula/argus.rb
          sed -i "s|sha256 \".*\"|sha256 \"${SHA256}\"|" Formula/argus.rb

          git config user.name "danultimate"
          git config user.email "dan16.daniel@gmail.com"
          git add Formula/argus.rb
          git diff --staged --quiet || git commit -m "argus ${VERSION}"
          git push
